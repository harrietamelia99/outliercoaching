# WordPress.com GitHub Deployments (Advanced mode).
# Artifact name MUST be "wpcom". See:
# https://wordpress.com/support/github-deployments/workflow-recipes/

name: Deploy Outlier theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  Publish-Website:
    name: Publish-Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # upload-artifact v4 strips the chosen directory name from the artifact root.
      # Uploading `outlier-collective/` would deploy style.css etc. at site root — WordPress
      # never sees a theme. Stage under `deploy/wp-content/themes/...` so the zip keeps
      # the full path WordPress expects.
      - name: Stage theme for WordPress.com
        run: |
          mkdir -p deploy/wp-content/themes
          cp -R wp-content/themes/outlier-collective deploy/wp-content/themes/

      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpcom
          path: deploy
          if-no-files-found: error
          retention-days: 1

      # Human fallback: Appearance → Install new theme → Upload (WordPress.com cannot be done from CI here).
      - name: Zip theme for manual upload
        run: ( cd wp-content/themes && zip -rq "$GITHUB_WORKSPACE/outlier-coaching-theme.zip" outlier-collective )

      - name: Upload installable theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: outlier-coaching-theme-zip
          path: outlier-coaching-theme.zip
          if-no-files-found: error
          retention-days: 14

      - name: WordPress upload hint (read this if install failed)
        run: |
          {
            echo '### Install this file in WordPress'
            echo ''
            echo 'GitHub wraps the download in **another** zip. After you download **outlier-coaching-theme-zip**:'
            echo ''
            echo '1. **Unzip** that download on your computer (double-click).'
            echo '2. Upload **`outlier-coaching-theme.zip`** — the file *inside* — in **Appearance → Install new theme**.'
            echo ''
            echo 'Do **not** upload the outer GitHub zip to WordPress (WordPress will say the stylesheet is missing).'
          } >> "$GITHUB_STEP_SUMMARY"
